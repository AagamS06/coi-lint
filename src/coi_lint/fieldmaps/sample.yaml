# Field map for the fictional sample certificate layout in examples/pdfs/ (generated by
# scripts/make_sample_pdfs.py). It is NOT an industry form. Copy it to map your own layouts:
# form_fields = fillable-PDF field names; text_patterns = regexes (one capture group) for flat or scanned PDFs.
name: coi-lint-sample
date_format: "%Y-%m-%d"
form_fields:
  insured: insured
  producer: producer
  holder: holder
  issued: issued
  description: description
  gl_policy_number: coverages.general_liability.policy_number
  gl_effective: coverages.general_liability.effective
  gl_expires: coverages.general_liability.expires
  gl_each_occurrence: coverages.general_liability.limits.each_occurrence
  gl_general_aggregate: coverages.general_liability.limits.general_aggregate
  gl_additional_insured: coverages.general_liability.additional_insured
  gl_waiver_of_subrogation: coverages.general_liability.waiver_of_subrogation
  au_policy_number: coverages.auto.policy_number
  au_effective: coverages.auto.effective
  au_expires: coverages.auto.expires
  au_combined_single_limit: coverages.auto.limits.combined_single_limit
  au_additional_insured: coverages.auto.additional_insured
  au_waiver_of_subrogation: coverages.auto.waiver_of_subrogation
  um_policy_number: coverages.umbrella.policy_number
  um_effective: coverages.umbrella.effective
  um_expires: coverages.umbrella.expires
  um_each_occurrence: coverages.umbrella.limits.each_occurrence
  um_additional_insured: coverages.umbrella.additional_insured
  um_waiver_of_subrogation: coverages.umbrella.waiver_of_subrogation
  wc_policy_number: coverages.workers_comp.policy_number
  wc_effective: coverages.workers_comp.effective
  wc_expires: coverages.workers_comp.expires
  wc_el_each_accident: coverages.workers_comp.limits.el_each_accident
  wc_additional_insured: coverages.workers_comp.additional_insured
  wc_waiver_of_subrogation: coverages.workers_comp.waiver_of_subrogation
text_patterns:
  'Insured:\s*(.+?)\s*\n': insured
  'Producer:\s*(.+?)\s*\n': producer
  'Certificate holder:\s*(.+?)\s*\n': holder
  'Issued:\s*(\d{4}-\d{2}-\d{2})': issued
  'Description of operations:\s*(.+?)\s*\n': description
  'GENERAL LIABILITY\s+Policy:\s*(\S+)': coverages.general_liability.policy_number
  'GENERAL LIABILITY\s+Policy:\s*\S+\s+Effective:\s*(\d{4}-\d{2}-\d{2})': coverages.general_liability.effective
  'GENERAL LIABILITY\s+Policy:.*?Expires:\s*(\d{4}-\d{2}-\d{2})': coverages.general_liability.expires
  'GENERAL LIABILITY\s+Policy:[^\n]*\n\s*[^\n]*?Each occurrence:\s*\$?([\d,]+)': coverages.general_liability.limits.each_occurrence
  'GENERAL LIABILITY\s+Policy:[^\n]*\n\s*[^\n]*?General aggregate:\s*\$?([\d,]+)': coverages.general_liability.limits.general_aggregate
  'GENERAL LIABILITY\s+Policy:[^\n]*\n\s*[^\n]*?Additional insured:\s*([YN])': coverages.general_liability.additional_insured
  'GENERAL LIABILITY\s+Policy:[^\n]*\n\s*[^\n]*?Waiver of subrogation:\s*([YN])': coverages.general_liability.waiver_of_subrogation
  'AUTOMOBILE LIABILITY\s+Policy:\s*(\S+)': coverages.auto.policy_number
  'AUTOMOBILE LIABILITY\s+Policy:\s*\S+\s+Effective:\s*(\d{4}-\d{2}-\d{2})': coverages.auto.effective
  'AUTOMOBILE LIABILITY\s+Policy:.*?Expires:\s*(\d{4}-\d{2}-\d{2})': coverages.auto.expires
  'AUTOMOBILE LIABILITY\s+Policy:[^\n]*\n\s*[^\n]*?Combined single limit:\s*\$?([\d,]+)': coverages.auto.limits.combined_single_limit
  'AUTOMOBILE LIABILITY\s+Policy:[^\n]*\n\s*[^\n]*?Additional insured:\s*([YN])': coverages.auto.additional_insured
  'AUTOMOBILE LIABILITY\s+Policy:[^\n]*\n\s*[^\n]*?Waiver of subrogation:\s*([YN])': coverages.auto.waiver_of_subrogation
  'UMBRELLA / EXCESS\s+Policy:\s*(\S+)': coverages.umbrella.policy_number
  'UMBRELLA / EXCESS\s+Policy:\s*\S+\s+Effective:\s*(\d{4}-\d{2}-\d{2})': coverages.umbrella.effective
  'UMBRELLA / EXCESS\s+Policy:.*?Expires:\s*(\d{4}-\d{2}-\d{2})': coverages.umbrella.expires
  'UMBRELLA / EXCESS\s+Policy:[^\n]*\n\s*[^\n]*?Each occurrence:\s*\$?([\d,]+)': coverages.umbrella.limits.each_occurrence
  'UMBRELLA / EXCESS\s+Policy:[^\n]*\n\s*[^\n]*?Additional insured:\s*([YN])': coverages.umbrella.additional_insured
  'UMBRELLA / EXCESS\s+Policy:[^\n]*\n\s*[^\n]*?Waiver of subrogation:\s*([YN])': coverages.umbrella.waiver_of_subrogation
  'WORKERS COMPENSATION\s+Policy:\s*(\S+)': coverages.workers_comp.policy_number
  'WORKERS COMPENSATION\s+Policy:\s*\S+\s+Effective:\s*(\d{4}-\d{2}-\d{2})': coverages.workers_comp.effective
  'WORKERS COMPENSATION\s+Policy:.*?Expires:\s*(\d{4}-\d{2}-\d{2})': coverages.workers_comp.expires
  'WORKERS COMPENSATION\s+Policy:[^\n]*\n\s*[^\n]*?EL each accident:\s*\$?([\d,]+)': coverages.workers_comp.limits.el_each_accident
  'WORKERS COMPENSATION\s+Policy:[^\n]*\n\s*[^\n]*?Additional insured:\s*([YN])': coverages.workers_comp.additional_insured
  'WORKERS COMPENSATION\s+Policy:[^\n]*\n\s*[^\n]*?Waiver of subrogation:\s*([YN])': coverages.workers_comp.waiver_of_subrogation
