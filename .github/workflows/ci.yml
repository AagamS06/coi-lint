name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y -q tesseract-ocr
      - run: pip install -e ".[dev,pdf,ocr]"
      - run: ruff check .
      - run: pytest -q
      - name: Extraction accuracy on the labelled set (30 fictional certificates)
        run: |
          python scripts/make_labelled_set.py
          coi-lint accuracy examples/labelled/pdfs --format md --min-accuracy 0.95 | tee -a "$GITHUB_STEP_SUMMARY"
